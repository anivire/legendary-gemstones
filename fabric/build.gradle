plugins {
	id 'com.github.johnrengelman.shadow'
	id 'me.modmuss50.mod-publish-plugin'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	mixin {
		defaultRefmapName = "gemstones.fabric-refmap.json"
	}
}

base {
	archivesName = "${rootProject.minecraft_version}-fabric-${rootProject.archives_base_name}"
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
	modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}"
	modCompileOnly "dev.emi:emi-fabric:${rootProject.emi_version}"

	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.rei_version}"
	modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modRuntimeOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', rootProject.minecraft_version
	inputs.property 'loader_version', rootProject.loader_version
	inputs.property 'fabric_version', rootProject.fabric_version
	inputs.property 'architectury_api_version', rootProject.architectury_api_version
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching('fabric.mod.json') {
		expand(
				'version': project.version,
				'minecraft_version': rootProject.minecraft_version,
				'loader_version': rootProject.loader_version,
				'fabric_version': rootProject.fabric_version,
				'architectury_api_version': rootProject.architectury_api_version)
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}

publishMods {
	file = remapJar.archiveFile
	changelog = providers.environmentVariable('CHANGELOG').orElse('')
	type = STABLE
	version = "${project.version}+fabric"
	displayName = "${rootProject.mod_display_name} ${project.version} (Fabric)"
	modLoaders.add('fabric')
	dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null || providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null

	modrinth {
		accessToken = providers.environmentVariable('MODRINTH_TOKEN')
		projectId = rootProject.modrinth_id
		minecraftVersions.add(rootProject.minecraft_version)
		requires('fabric-api', 'architectury-api')
		optional('rei', 'emi', 'cloth-config', 'modmenu')
	}

	curseforge {
		accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
		projectId = rootProject.curseforge_id
		minecraftVersions.add(rootProject.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_21)
		clientRequired = true
		serverRequired = true
		requires('fabric-api', 'architectury-api')
		optional('roughly-enough-items', 'emi', 'cloth-config', 'modmenu')
	}
}
